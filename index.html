<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Academic Calendar - 2026 | Nursing and Midwifery College, Gopalganj.</title>

  <!-- Tailwind CSS for clean toolbar & responsive chrome -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Inter Font for crisp, legible typography on screen and print -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <style>
    /* ==========================================================================
       COLOR TOKENS & BASE RESET
       ========================================================================== */
    :root {
      --color-Y: #f2e03a; /* Theory class */
      --color-C: #4caf50; /* Clinical practice */
      --color-P: #8c88d8; /* LP */
      --color-R: #f05a3a; /* Practicum */
      --color-W: #d94b5b; /* Weekly Holiday */
      --color-G: #a6d854; /* Special Leave */
      --color-B: #5c7cfa; /* Exam */
      --color-NONE: #ffffff;
    }

    * {
      box-sizing: border-box;
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
      color-adjust: exact !important;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #f1f5f9;
      color: #0f172a;
      margin: 0;
      padding: 0;
    }

    /* ==========================================================================
       PAPER SHEET CONTAINER (SCREEN PREVIEW)
       ========================================================================== */
    .sheet-viewport {
      width: 100%;
      overflow-x: auto;
      padding: 16px;
    }

    .calendar-sheet {
      background: #ffffff;
      width: 100%;
      min-width: 1320px;
      max-width: 1640px;
      margin: 0 auto;
      padding: 16px 18px 18px 18px;
      border-radius: 10px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.12), 0 1px 3px rgba(15, 23, 42, 0.08);
      border: 1px solid #cbd5e1;
    }

    /* ==========================================================================
       HEADER & LEGEND BOX
       ========================================================================== */
    .sheet-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 10px;
    }

    .title-block {
      flex: 1;
      text-align: center;
      padding-left: 12px;
    }

    .title-main {
      font-size: 21px;
      font-weight: 800;
      letter-spacing: 0.02em;
      color: #000000;
      line-height: 1.2;
      margin: 0;
    }

    .title-sub1 {
      font-size: 13.5px;
      font-weight: 700;
      color: #111827;
      line-height: 1.3;
      margin: 2px 0 0 0;
    }

    .title-sub2 {
      font-size: 12.5px;
      font-weight: 600;
      color: #1f2937;
      line-height: 1.3;
      margin: 1px 0 0 0;
    }

    /* Editable text highlight on screen only */
    [contenteditable="true"] {
      outline: none;
      border-radius: 4px;
      transition: background-color 0.15s ease, box-shadow 0.15s ease;
    }

    [contenteditable="true"]:hover {
      background-color: rgba(59, 130, 246, 0.08);
    }

    [contenteditable="true"]:focus {
      background-color: rgba(59, 130, 246, 0.14);
      box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.35);
    }

    /* Legend Box */
    .legend-box {
      border: 1.8px solid #000000;
      background: #ffffff;
      padding: 6px 10px;
      flex-shrink: 0;
    }

    .legend-grid {
      display: grid;
      grid-template-columns: repeat(4, auto);
      column-gap: 14px;
      row-gap: 5px;
      align-items: center;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .legend-swatch {
      width: 18px;
      height: 12px;
      border: 1px solid #222222;
      flex-shrink: 0;
      display: inline-block;
    }

    .legend-label {
      font-size: 10.5px;
      font-weight: 600;
      color: #111111;
      padding: 0 2px;
    }

    /* ==========================================================================
       36-COLUMN ACADEMIC CALENDAR TABLE
       ========================================================================== */
    .calendar-table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      border: 1.8px solid #000000;
      user-select: none;
    }

    .calendar-table th,
    .calendar-table td {
      border: 1px solid #222222;
      padding: 1px 2px;
      text-align: center;
      vertical-align: middle;
      white-space: nowrap;
    }

    .calendar-table td {
      overflow: hidden;
    }

    /* Month header row */
    tr.month-row th {
      font-size: 11px;
      font-weight: 800;
      background-color: #f8fafc;
      color: #000000;
      padding: 5px 2px;
      letter-spacing: 0.01em;
      border-bottom: 1.5px solid #000000;
      overflow: hidden;
    }

    /* ==========================================================================
       CRITICAL FIX: VERTICAL SUB-HEADERS (Date | Day | Schedule)
       100% visible with generous breathing room and zero clipping
       ========================================================================== */
    tr.sub-header th {
      height: 62px;
      background-color: #f1f5f9;
      color: #111827;
      padding: 4px 0 !important;
      vertical-align: middle;
      text-align: center;
      white-space: nowrap;
      overflow: visible !important;
      border-bottom: 1.8px solid #000000;
    }

    .v-text {
      display: inline-block;
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      white-space: nowrap;
      line-height: 1;
      font-size: 9.5px;
      font-weight: 700;
      letter-spacing: 0.01em;
      color: #111111;
      vertical-align: middle;
    }

    /* Column proportions across 12 months (each month = 8.3333%)
       Date (~16-22px), Day (~44-58px), Schedule (~18-26px) */
    .col-date {
      width: 1.75%;
    }
    .col-day {
      width: 4.55%;
    }
    .col-sched {
      width: 2.0333%;
    }

    /* Body cell styling */
    .cell-date {
      font-size: 9px;
      font-weight: 700;
      color: #111111;
      height: 19px;
    }

    .cell-day {
      font-size: 8.5px;
      font-weight: 500;
      color: #1f2937;
      text-align: left !important;
      padding-left: 3px !important;
      text-overflow: clip;
    }

    .cell-sched {
      cursor: crosshair;
      padding: 0 !important;
      transition: filter 0.08s ease;
    }

    .cell-sched:hover {
      filter: brightness(0.92);
      box-shadow: inset 0 0 0 1.5px rgba(15, 23, 42, 0.55);
    }

    .cell-empty {
      background-color: #eef2f6;
      cursor: default;
    }

    /* Thicker 1.8px solid #000 vertical borders separating each month */
    .month-start {
      border-left: 1.8px solid #000000 !important;
    }

    .month-end {
      border-right: 1.8px solid #000000 !important;
    }

    /* Solid background color classes for Schedule cells (Strictly no text) */
    .bg-code-Y { background-color: var(--color-Y) !important; }
    .bg-code-C { background-color: var(--color-C) !important; }
    .bg-code-P { background-color: var(--color-P) !important; }
    .bg-code-R { background-color: var(--color-R) !important; }
    .bg-code-W { background-color: var(--color-W) !important; }
    .bg-code-G { background-color: var(--color-G) !important; }
    .bg-code-B { background-color: var(--color-B) !important; }
    .bg-code-NONE { background-color: var(--color-NONE) !important; }

    /* Palette button active ring */
    .palette-btn.active {
      outline: 2px solid #0f172a;
      outline-offset: 2px;
      transform: translateY(-1px);
    }

    /* ==========================================================================
       PRINT STYLES (@media print) — SINGLE LANDSCAPE PAGE (A3 / A4)
       ========================================================================== */
    @page {
      size: A3 landscape;
      margin: 6mm;
    }

    @media print {
      html, body {
        width: 100%;
        height: 100%;
        margin: 0 !important;
        padding: 0 !important;
        background: #ffffff !important;
        overflow: hidden !important;
      }

      .toolbar,
      .no-print {
        display: none !important;
      }

      .sheet-viewport {
        padding: 0 !important;
        margin: 0 !important;
        overflow: visible !important;
        width: 100% !important;
        height: 100% !important;
      }

      .calendar-sheet {
        width: 100% !important;
        min-width: 0 !important;
        max-width: none !important;
        height: 100vh !important;
        margin: 0 !important;
        padding: 0 !important;
        border: none !important;
        border-radius: 0 !important;
        box-shadow: none !important;
        display: flex !important;
        flex-direction: column !important;
        page-break-inside: avoid !important;
        break-inside: avoid !important;
      }

      .sheet-header {
        margin-bottom: 4px !important;
        flex-shrink: 0 !important;
      }

      .title-main {
        font-size: 16pt !important;
      }

      .title-sub1 {
        font-size: 10.5pt !important;
      }

      .title-sub2 {
        font-size: 9.5pt !important;
      }

      .legend-box {
        padding: 3px 7px !important;
        border-width: 1.5px !important;
      }

      .legend-grid {
        column-gap: 10px !important;
        row-gap: 3px !important;
      }

      .legend-swatch {
        width: 14px !important;
        height: 10px !important;
      }

      .legend-label {
        font-size: 8pt !important;
      }

      [contenteditable="true"] {
        background: transparent !important;
        box-shadow: none !important;
      }

      .calendar-table {
        flex: 1 1 auto !important;
        height: 100% !important;
        page-break-inside: avoid !important;
        break-inside: avoid !important;
      }

      .calendar-table tr {
        page-break-inside: avoid !important;
        break-inside: avoid !important;
      }

      tr.month-row th {
        font-size: 8.5pt !important;
        padding: 2.5px 1px !important;
      }

      /* Print-safe vertical sub-header dimensions */
      tr.sub-header th {
        height: 15mm !important;
        padding: 2px 0 !important;
        overflow: visible !important;
      }

      .v-text {
        font-size: 7.5pt !important;
        font-weight: 700 !important;
      }

      .cell-date {
        font-size: 7pt !important;
        height: auto !important;
        padding: 0.5px 1px !important;
      }

      .cell-day {
        font-size: 6.8pt !important;
        padding: 0.5px 1px 0.5px 2px !important;
      }

      .cell-sched:hover {
        filter: none !important;
        box-shadow: none !important;
      }
    }
  </style>
</head>

          21:'C', 22:'C', 23:'C', 24:'C', 25:'C', 26:'W', 27:'G', 28:'G', 29:'G', 30:'G'
        },
        6: { // July (31) — Theory / Special Leave + LP & Exam blocks
          1:'Y', 2:'Y', 3:'W', 4:'Y', 5:'Y', 6:'Y', 7:'Y', 8:'Y', 9:'Y', 10:'W',
          11:'P', 12:'P', 13:'P', 14:'P', 15:'P', 16:'P', 17:'W', 18:'B', 19:'B', 20:'B',
          21:'B', 22:'B', 23:'B', 24:'W', 25:'G', 26:'G', 27:'G', 28:'G', 29:'G', 30:'G', 31:'W'
        },
        7: { // August (31) — Clinical/Leave early Aug + Practicum (Orange-Red) Aug 15-30
          1:'G', 2:'G', 3:'G', 4:'G', 5:'G', 6:'G', 7:'W', 8:'G', 9:'G', 10:'G',
          11:'G', 12:'G', 13:'G', 14:'W', 15:'R', 16:'R', 17:'R', 18:'R', 19:'R', 20:'R',
          21:'W', 22:'R', 23:'R', 24:'R', 25:'R', 26:'R', 27:'R', 28:'W', 29:'R', 30:'R', 31:''
        },
        8: { // September (30) — LP/Exam & Theory blocks
          1:'P', 2:'P', 3:'P', 4:'W', 5:'P', 6:'P', 7:'P', 8:'P', 9:'P', 10:'P',
          11:'W', 12:'Y', 13:'Y', 14:'Y', 15:'Y', 16:'Y', 17:'Y', 18:'W', 19:'Y', 20:'Y',
          21:'Y', 22:'Y', 23:'Y', 24:'Y', 25:'W', 26:'Y', 27:'Y', 28:'Y', 29:'Y', 30:'Y'
        },
        9: { // October (31) — LP, Exam, and Clinical practice mid-Oct
          1:'P', 2:'W', 3:'P', 4:'P', 5:'P', 6:'P', 7:'P', 8:'P', 9:'W', 10:'B',
          11:'B', 12:'B', 13:'B', 14:'B', 15:'B', 16:'W', 17:'C', 18:'C', 19:'C', 20:'C',
          21:'C', 22:'C', 23:'W', 24:'B', 25:'B', 26:'B', 27:'B', 28:'B', 29:'B', 30:'W', 31:'B'
        },
        10: { // November (30) — Practicum (Orange-Red) Nov 1-19 + Exam late Nov
          1:'R', 2:'R', 3:'R', 4:'R', 5:'R', 6:'W', 7:'R', 8:'R', 9:'R', 10:'R',
          11:'R', 12:'R', 13:'W', 14:'R', 15:'R', 16:'R', 17:'R', 18:'R', 19:'R', 20:'W',
          21:'B', 22:'B', 23:'B', 24:'B', 25:'B', 26:'B', 27:'W', 28:'B', 29:'B', 30:'B'
        },
        11: { // December (31) — LP & Exam blocks
          1:'P', 2:'P', 3:'P', 4:'W', 5:'P', 6:'P', 7:'P', 8:'P', 9:'P', 10:'P',
          11:'W', 12:'P', 13:'P', 14:'P', 15:'P', 16:'P', 17:'P', 18:'W', 19:'P', 20:'P',
          21:'P', 22:'P', 23:'P', 24:'P', 25:'W', 26:'B', 27:'B', 28:'B', 29:'B', 30:'B', 31:'B'
        }
      };

      // Runtime state (preserves saved edits in downloaded HTML copies)
      let currentSchedule = window.__SAVED_SCHEDULE__
        ? JSON.parse(JSON.stringify(window.__SAVED_SCHEDULE__))
        : JSON.parse(JSON.stringify(DEFAULT_SCHEDULE));

      let activeBrushCode = 'Y';
      let isMousePainting = false;
      let toastTimer = null;

      // DOM References
      const colgroupEl = document.getElementById('calendarColgroup');
      const theadEl = document.getElementById('calendarHead');
      const tbodyEl = document.getElementById('calendarBody');
      const toastEl = document.getElementById('toast');

      /**
       * Returns total number of days in a 0-indexed month for YEAR.
       */
      function getDaysInMonth(monthIdx) {
        return new Date(YEAR, monthIdx + 1, 0).getDate();
      }

      /**
       * Maps a schedule color code to its CSS background class.
       */
      function getColorClass(code) {
        return code ? 'bg-code-' + code : 'bg-code-NONE';
      }

      /**
       * Displays a brief non-blocking toast message.
       */
      function showToast(message) {
        if (!toastEl) return;
        toastEl.textContent = message;
        toastEl.classList.remove('hidden');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
          toastEl.classList.add('hidden');
        }, 2600);
      }

      /**
       * Helper to build a vertically rotated sub-header <th> with an inner span
       * so 'Date', 'Day', and 'Schedule' are 100% visible with zero clipping.
       */
      function createVerticalSubHeader(label, extraClass) {
        const th = document.createElement('th');
        if (extraClass) th.className = extraClass;

        const span = document.createElement('span');
        span.className = 'v-text';
        span.textContent = label;

        th.appendChild(span);
        return th;
      }

      /**
       * Paints a Schedule <td> cell with a solid color fill and strictly NO text.
       */
      function paintCell(td, code) {
        const m = Number(td.dataset.month);
        const d = Number(td.dataset.day);
        if (Number.isNaN(m) || Number.isNaN(d)) return;

        td.classList.remove(
          'bg-code-Y', 'bg-code-C', 'bg-code-P', 'bg-code-R',
          'bg-code-W', 'bg-code-G', 'bg-code-B', 'bg-code-NONE'
        );

        td.classList.add(getColorClass(code));
        td.dataset.code = code;
        td.textContent = ''; // Enforce strictly NO text inside colored cells

        if (!currentSchedule[m]) currentSchedule[m] = {};
        currentSchedule[m][d] = code;
      }

      /**
       * Generates the 36-column colgroup, 2-row header, and 31-row calendar body.
       */
      function renderCalendar() {
        // 1. Colgroup
        colgroupEl.innerHTML = '';
        for (let m = 0; m < 12; m++) {
          const cDate = document.createElement('col');
          cDate.className = 'col-date';
          const cDay = document.createElement('col');
          cDay.className = 'col-day';
          const cSched = document.createElement('col');
          cSched.className = 'col-sched';
          colgroupEl.appendChild(cDate);
          colgroupEl.appendChild(cDay);
          colgroupEl.appendChild(cSched);
        }

        // 2. Table Head (Row 1: Month Names, Row 2: Vertical Date | Day | Schedule)
        theadEl.innerHTML = '';
        const trMonths = document.createElement('tr');
        trMonths.className = 'month-row';

        const trSubs = document.createElement('tr');
        trSubs.className = 'sub-header';

        for (let m = 0; m < 12; m++) {
          const thMonth = document.createElement('th');
          thMonth.colSpan = 3;
          thMonth.textContent = MONTHS[m];
          thMonth.className = 'month-start month-end';
          trMonths.appendChild(thMonth);

          trSubs.appendChild(createVerticalSubHeader('Date', 'month-start'));
          trSubs.appendChild(createVerticalSubHeader('Day', ''));
          trSubs.appendChild(createVerticalSubHeader('Schedule', 'month-end'));
        }

        theadEl.appendChild(trMonths);
        theadEl.appendChild(trSubs);

        // 3. Table Body (Days 1 to 31)
        tbodyEl.innerHTML = '';
        for (let day = 1; day <= 31; day++) {
          const tr = document.createElement('tr');

          for (let m = 0; m < 12; m++) {
            const daysInMonth = getDaysInMonth(m);
            const isValidDay = day <= daysInMonth;

            const tdDate = document.createElement('td');
            const tdDay = document.createElement('td');
            const tdSched = document.createElement('td');

            if (isValidDay) {
              const dateObj = new Date(YEAR, m, day);
              const weekdayName = WEEKDAYS[dateObj.getDay()];
              const code = (currentSchedule[m] && currentSchedule[m][day]) || '';

              tdDate.textContent = String(day);
              tdDate.className = 'cell-date month-start';

              tdDay.textContent = weekdayName;
              tdDay.className = 'cell-day';

              // Schedule cell: solid color block ONLY, strictly empty text
              tdSched.textContent = '';
              tdSched.className = 'cell-sched month-end ' + getColorClass(code);
              tdSched.dataset.month = String(m);
              tdSched.dataset.day = String(day);
              tdSched.dataset.code = code;
            } else {
              // Non-existent dates (e.g., Feb 29-31, Apr 31) shaded cleanly
              tdDate.className = 'cell-date cell-empty month-start';
              tdDay.className = 'cell-day cell-empty';
              tdSched.className = 'cell-empty month-end';
            }

            tr.appendChild(tdDate);
            tr.appendChild(tdDay);
            tr.appendChild(tdSched);
          }

          tbodyEl.appendChild(tr);
        }
      }

      /**
       * Binds click-and-drag painting for mouse and touch interactions.
       */
      function bindPaintingEvents() {
        tbodyEl.addEventListener('mousedown', (e) => {
          const cell = e.target.closest('.cell-sched');
          if (!cell) return;
          e.preventDefault();
          isMousePainting = true;
          paintCell(cell, activeBrushCode);
        });

        tbodyEl.addEventListener('mouseover', (e) => {
          if (!isMousePainting) return;
          const cell = e.target.closest('.cell-sched');
          if (!cell) return;
          paintCell(cell, activeBrushCode);
        });

        window.addEventListener('mouseup', () => {
          isMousePainting = false;
        });

        tbodyEl.addEventListener('touchstart', (e) => {
          const cell = e.target.closest('.cell-sched');
          if (!cell) return;
          paintCell(cell, activeBrushCode);
        }, { passive: true });
      }

      /**
       * Binds toolbar buttons: Brush Palette, Reset, Download HTML, Print / Save as PDF.
       */
      function bindToolbarEvents() {
        const paletteBtns = document.querySelectorAll('.palette-btn');
        paletteBtns.forEach((btn) => {
          btn.addEventListener('click', () => {
            paletteBtns.forEach((b) => b.classList.remove('active'));
            btn.classList.add('active');
            activeBrushCode = btn.dataset.code || '';
          });
        });

        document.getElementById('btnPrint').addEventListener('click', () => {
          window.print();
        });

        document.getElementById('btnReset').addEventListener('click', () => {
          currentSchedule = JSON.parse(JSON.stringify(DEFAULT_SCHEDULE));
          renderCalendar();
          showToast('Calendar colors reset to default 2026 schedule.');
        });

        document.getElementById('btnDownload').addEventListener('click', () => {
          try {
            const clone = document.documentElement.cloneNode(true);

            const oldSaved = clone.querySelector('#savedScheduleState');
            if (oldSaved) oldSaved.remove();

            const savedScript = document.createElement('script');
            savedScript.id = 'savedScheduleState';
            savedScript.textContent = 'window.__SAVED_SCHEDULE__ = ' + JSON.stringify(currentSchedule) + ';';

            const mainScript = clone.querySelector('#calendarAppScript');
            if (mainScript && mainScript.parentNode) {
              mainScript.parentNode.insertBefore(savedScript, mainScript);
            }

            const cloneToast = clone.querySelector('#toast');
            if (cloneToast) cloneToast.classList.add('hidden');

            const htmlOutput = '<!DOCTYPE html>\n' + clone.outerHTML;
            const blob = new Blob([htmlOutput], { type: 'text/html;charset=utf-8' });
            const url = URL.createObjectURL(blob);

            const a = document.createElement('a');
            a.href = url;
            a.download = 'Academic_Calendar_2026_Midwifery.html';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);

            showToast('Standalone HTML calendar downloaded!');
          } catch (err) {
            console.error('Download failed:', err);
            showToast('Could not download file. Please use Print / Save as PDF.');
          }
        });
      }

      // Initialize application
      renderCalendar();
      bindPaintingEvents();
      bindToolbarEvents();
    })();
  </script>
</body>
</html>
